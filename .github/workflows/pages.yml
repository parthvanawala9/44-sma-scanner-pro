name: Deploy 44 SMA Dashboard

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard
        run: |

          rm -rf site

          mkdir -p site
          mkdir -p site/data

          cp dashboard/index.html site/index.html
          cp dashboard/app.js site/app.js
          cp dashboard/style.css site/style.css

          if [ -f data/signals.json ]; then
            cp data/signals.json site/data/signals.json
          else
            echo '{"scannedAt":null,"buy":[],"sell":[],"buyCount":0,"sellCount":0,"scanned":0}' > site/data/signals.json
          fi

          if [ -f data/history.json ]; then
            cp data/history.json site/data/history.json
          else
            echo '[]' > site/data/history.json
          fi

          if [ -f data/universe.json ]; then
            cp data/universe.json site/data/universe.json
          fi

          if [ -f data/skipped.json ]; then
            cp data/skipped.json site/data/skipped.json
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
