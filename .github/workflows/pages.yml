name: Deploy 44 SMA Dashboard

on:
  workflow_run:
    workflows:
      - "44 SMA Scanner"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PREPARE DASHBOARD
      # ======================================================

      - name: Prepare dashboard
        run: |

          rm -rf site

          mkdir -p site
          mkdir -p site/data


          # --------------------------------------------------
          # DASHBOARD FILES
          # --------------------------------------------------

          cp dashboard/index.html site/index.html
          cp dashboard/app.js site/app.js
          cp dashboard/style.css site/style.css


          # --------------------------------------------------
          # SCANNER DATA
          # --------------------------------------------------

          cp data/signals.json site/data/signals.json
          cp data/history.json site/data/history.json


          # --------------------------------------------------
          # PORTFOLIO DATA
          # --------------------------------------------------

          if [ -f data/portfolio.json ]; then
            cp data/portfolio.json site/data/portfolio.json
          fi


          # --------------------------------------------------
          # UNIVERSE DATA
          # --------------------------------------------------

          if [ -f data/universe.json ]; then
            cp data/universe.json site/data/universe.json
          fi


          # --------------------------------------------------
          # SKIPPED STOCKS
          # --------------------------------------------------

          if [ -f data/skipped.json ]; then
            cp data/skipped.json site/data/skipped.json
          fi


          # --------------------------------------------------
          # CHART DATA
          # --------------------------------------------------

          if [ -d data/charts ]; then
            mkdir -p site/data/charts
            cp -r data/charts/. site/data/charts/
          fi


          # --------------------------------------------------
          # SHOW WHAT WILL BE DEPLOYED
          # --------------------------------------------------

          echo ""
          echo "========================================"
          echo "DASHBOARD FILES"
          echo "========================================"

          find site -type f | sort

          echo ""
          echo "========================================"
          echo "PORTFOLIO CHECK"
          echo "========================================"

          if [ -f site/data/portfolio.json ]; then
            echo "✅ portfolio.json copied successfully"
          else
            echo "⚠️ portfolio.json not found"
          fi

          echo ""
          echo "========================================"
          echo "CHART CHECK"
          echo "========================================"

          if [ -d site/data/charts ]; then
            echo "✅ Charts directory copied"

            echo "Chart files:"
            find site/data/charts -type f | wc -l

          else
            echo "⚠️ No charts directory found"
          fi


      # ======================================================
      # SETUP GITHUB PAGES
      # ======================================================

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ======================================================
      # UPLOAD DASHBOARD
      # ======================================================

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site


  # ========================================================
  # DEPLOY
  # ========================================================

  deploy:

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
