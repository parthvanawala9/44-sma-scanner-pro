name: 44 SMA Scanner

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST
    # Monday to Friday
    - cron: "30 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt


      - name: Run 44 SMA scanner
        run: |
          python scanner/scan.py


      - name: Show scan summary
        run: |
          echo "========================================"
          echo "44 SMA SCANNER RESULT"
          echo "========================================"

          python - <<'PY'
          import json

          with open("data/signals.json", "r") as f:
              data = json.load(f)

          print("Universe:", data.get("universe"))
          print("Universe count:", data.get("universeCount"))
          print("Successfully scanned:", data.get("scanned"))
          print("Skipped:", data.get("skipped"))
          print("BUY:", data.get("buyCount"))
          print("SELL:", data.get("sellCount"))
          PY


      - name: Commit scan results
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/signals.json
          git add data/history.json
          git add data/universe.json
          git add data/skipped.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update 44 SMA scan results"
            git push
          fi
