name: 44 SMA Scanner

on:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC
    - cron: '30 10 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run 44 SMA scanner
        run: |
          python scanner/scan.py


      # ======================================================
      # SHOW SCAN SUMMARY
      # ======================================================

      - name: Show scan summary
        run: |
          echo ""
          echo "=============================================="
          echo "44 SMA SCANNER RESULT"
          echo "=============================================="

          if [ -f data/signals.json ]; then
            python - <<'PY'
          import json

          with open("data/signals.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Universe          :", data.get("universe"))
          print("Universe count    :", data.get("universeCount"))
          print("Successfully scanned :", data.get("scanned"))
          print("Skipped            :", data.get("skipped"))
          print("BUY                :", data.get("buyCount"))
          print("SELL               :", data.get("sellCount"))
          PY
          else
            echo "signals.json not found"
          fi

          echo ""
          echo "Chart files:"
          
          if [ -d data/charts ]; then
            find data/charts -type f -name "*.json" | wc -l
          else
            echo "0"
          fi

          echo ""
          echo "=============================================="


      # ======================================================
      # COMMIT EVERYTHING IN DATA/
      # ======================================================

      - name: Commit scan results
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Add EVERYTHING inside data/
          # This includes:
          #
          # data/signals.json
          # data/history.json
          # data/universe.json
          # data/skipped.json
          # data/charts/*.json

          git add data/


          # Check whether anything changed

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update 44 SMA scan results and charts"

            git push

          fi
