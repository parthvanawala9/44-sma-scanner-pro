name: 44 SMA Scanner

on:

  schedule:

    # 4:00 PM IST, Monday to Friday
    - cron: "0 16 * * 1-5"
      timezone: "Asia/Kolkata"

  workflow_dispatch:


permissions:

  contents: write
  pages: write
  id-token: write


jobs:

  scan:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # SETUP PYTHON
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r scanner/requirements.txt


      # ======================================================
      # RUN SCANNER
      # ======================================================

      - name: Run 44 SMA scanner

        run: |

          python scanner/scan.py


      # ======================================================
      # SHOW SCAN SUMMARY
      # ======================================================

      - name: Show scan summary

        run: |

          echo "========================================"

          echo "44 SMA SCANNER RESULT"

          echo "========================================"

          python - <<'PY'

          import json

          with open("data/signals.json", "r") as f:

              data = json.load(f)


          print(
              "Universe:",
              data.get("universe")
          )

          print(
              "Universe count:",
              data.get("universeCount")
          )

          print(
              "Successfully scanned:",
              data.get("scanned")
          )

          print(
              "Skipped:",
              data.get("skipped")
          )

          print(
              "BUY:",
              data.get("buyCount")
          )

          print(
              "SELL:",
              data.get("sellCount")
          )


          try:

              with open(
                  "data/portfolio.json",
                  "r"
              ) as f:

                  portfolio = json.load(f)


              print(
                  "Portfolio positions:",
                  portfolio.get(
                      "openPositionsCount",
                      0
                  )
              )

              print(
                  "Portfolio invested:",
                  portfolio.get(
                      "totalInvested",
                      0
                  )
              )

              print(
                  "Portfolio value:",
                  portfolio.get(
                      "totalCurrentValue",
                      0
                  )
              )

              print(
                  "Portfolio P&L:",
                  portfolio.get(
                      "totalPnL",
                      0
                  )
              )

          except Exception as error:

              print(
                  "Portfolio summary error:",
                  error
              )

          PY


      # ======================================================
      # COMMIT ALL SCAN DATA
      # ======================================================

      - name: Commit scan results

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/signals.json

          git add data/history.json

          git add data/universe.json

          git add data/skipped.json

          git add data/portfolio.json

          git add data/charts/


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update 44 SMA scan results"

            git push

          fi
