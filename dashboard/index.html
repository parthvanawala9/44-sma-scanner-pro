<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>44 SMA Scanner Pro</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-main">
                44 SMA
            </div>

            <div class="logo-sub">
                SCANNER PRO
            </div>

        </div>


        <nav>

            <button
                class="nav-item active"
                data-tab="dashboard"
            >
                <span>⌂</span>
                Dashboard
            </button>


            <button
                class="nav-item"
                data-tab="buy"
            >
                <span class="green-dot"></span>
                BUY
            </button>


            <button
                class="nav-item"
                data-tab="sell"
            >
                <span class="red-dot"></span>
                SELL
            </button>


            <button
                class="nav-item"
                data-tab="portfolio"
            >
                <span>▣</span>
                Portfolio
            </button>


            <button
                class="nav-item"
                data-tab="history"
            >
                <span>◷</span>
                History
            </button>

        </nav>


        <div class="strategy-box">

            <div class="strategy-title">
                STRATEGY
            </div>

            <div class="strategy-line">
                44 SMA
            </div>

            <div class="strategy-line">
                100 SMA
            </div>

            <div class="strategy-line">
                200 SMA
            </div>

            <div class="strategy-line">
                ₹5,000 / BUY
            </div>

        </div>

    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <header class="topbar">

            <div>

                <div class="eyebrow">
                    NSE DAILY SCANNER
                </div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

            </div>


            <div class="top-actions">

                <div
                    id="lastScan"
                    class="last-scan"
                >
                    Last scan: —
                </div>


                <button
                    id="refreshButton"
                    class="refresh-button"
                    type="button"
                >
                    ↻ Refresh Data
                </button>

            </div>

        </header>


        <section id="content"></section>


    </main>

</div>



<!-- =========================================================
     STOCK MODAL
========================================================== -->

<div
    id="stockModal"
    class="modal hidden"
>

    <div class="modal-overlay"></div>

    <div class="modal-card">

        <button
            id="closeModal"
            class="modal-close"
            type="button"
        >
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>



<script src="app.js?v=20260813-1930"></script>


</body>

</html>
